# PolyEdge — Unified Docker Compose
#
# Architecture:
#   - timescaledb: Shared database (persistent volume, never restarted by updates)
#   - core:        Data collector — runs 24/7, NEVER restarted on code updates
#   - analysis:    Strategy research — run on-demand, restarts are safe
#   - trading:     Live trading bot — can be restarted independently
#   - trading-weather: Dedicated weather merge bot — can be restarted independently
#   - dashboard:   Next.js dashboard for monitoring + light control actions
#
# Update workflow (on LXC):
#   1. git pull
#   2. docker compose build analysis trading trading-weather dashboard
#   3. docker compose up -d analysis trading trading-weather dashboard
#   # Core keeps running untouched!
#
# To update core (rare, planned downtime):
#   docker compose build core && docker compose up -d core

services:
  # ── Database (shared, persistent) ─────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    platform: linux/amd64
    profiles: ["localdb"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - polyedge

  # ── Core: Data collector (24/7, never restart on updates) ─────────────
  core:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: polyedge-core
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      CORE_DEBUG_MODE: "false"
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://api.binance.com}
      BINANCE_TRACKED_SYMBOLS: ${BINANCE_TRACKED_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT}
      BINANCE_BACKFILL_LOOKBACK_SECONDS: ${BINANCE_BACKFILL_LOOKBACK_SECONDS:-120}
      BINANCE_STALE_DATA_THRESHOLD_SECONDS: ${BINANCE_STALE_DATA_THRESHOLD_SECONDS:-3}
    volumes:
      - ./logs/core:/app/logs
    restart: unless-stopped
    networks:
      - polyedge
    # Labels to identify this as a "do not touch" service
    labels:
      polyedge.role: "core"
      polyedge.update: "never"

  # ── Core debug: safe parallel validation, never writes to DB ──────────
  # Weather collector: uses the shared external DB from .env
  weather:
    build:
      context: .
      dockerfile: docker/Dockerfile.weather
    container_name: polyedge-weather
    platform: linux/amd64
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./logs/weather:/app/logs
    restart: unless-stopped
    networks:
      - polyedge
    labels:
      polyedge.role: "weather"
      polyedge.update: "safe"

  # Core debug: safe parallel validation, never writes to DB
  core-debug:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: polyedge-core-debug
    platform: linux/amd64
    profiles: ["debug"]
    environment:
      CORE_DEBUG_MODE: "true"
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://api.binance.com}
      BINANCE_TRACKED_SYMBOLS: ${BINANCE_TRACKED_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT}
      BINANCE_BACKFILL_LOOKBACK_SECONDS: ${BINANCE_BACKFILL_LOOKBACK_SECONDS:-120}
      BINANCE_STALE_DATA_THRESHOLD_SECONDS: ${BINANCE_STALE_DATA_THRESHOLD_SECONDS:-3}
    volumes:
      - ./logs/core:/app/logs
    restart: "no"
    networks:
      - polyedge
    labels:
      polyedge.role: "core-debug"
      polyedge.update: "safe"

  # ── Analysis: Strategy research (run on-demand) ───────────────────────
  analysis:
    build:
      context: .
      dockerfile: docker/Dockerfile.analysis
    container_name: polyedge-analysis
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./logs/analysis:/app/logs
    restart: "no"
    networks:
      - polyedge
    labels:
      polyedge.role: "analysis"
      polyedge.update: "safe"

  # ── Trading: Live trading bot (can restart independently) ─────────────
  trading:
    build:
      context: .
      dockerfile: docker/Dockerfile.trading
    container_name: polyedge-trading
    platform: linux/amd64
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./logs/trading:/app/logs
    restart: unless-stopped
    networks:
      - polyedge
    labels:
      polyedge.role: "trading"
      polyedge.update: "safe"

  # ── Trading Weather: Dedicated ColdMath-style merge bot ──────────────
  trading-weather:
    build:
      context: .
      dockerfile: docker/Dockerfile.trading
    container_name: polyedge-trading-weather
    platform: linux/amd64
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      WEATHER_MERGE_SEQUENCE_BUDGET_USD: "5"
      WEATHER_MERGE_MAX_TOTAL_EXPOSURE_USD: "10"
      WEATHER_MERGE_DAILY_LOSS_LIMIT_USD: "5"
      WEATHER_MERGE_TOTAL_SPEND_LIMIT_USD: "30"
      WEATHER_MERGE_MAX_CONCURRENT_POSITIONS: "1"
      WEATHER_MERGE_MAX_ENTRY_ATTEMPTS: "1"
      WEATHER_MERGE_LOOP_INTERVAL_SECONDS: "30"
      WEATHER_MERGE_SUMMARY_INTERVAL_SECONDS: "60"
      WEATHER_MERGE_REQUIRE_CLEAN_WALLET: "true"
      WEATHER_MERGE_ACTIVITY_LOOKBACK_MINUTES: "60"
      WEATHER_MERGE_ALLOW_ORPHANED_POSITIONS: "false"
      WEATHER_CLONE_ENABLE_LIVE: "true"
    command:
      [
        "python",
        "-u",
        "-m",
        "trading_weather.main",
        "--engine",
        "auto",
        "--config-path",
        "/app/src/results/wallet_forensics/coldmath_resume_smoke_v3/wallet_coldmath_clone_bot_config.json"
      ]
    volumes:
      - ./logs/trading-weather:/app/logs
    restart: unless-stopped
    networks:
      - polyedge
    labels:
      polyedge.role: "trading-weather"
      polyedge.update: "safe"

  # ── Wallet Tracker: Periodic activity fetcher for tracked profiles ────
  wallet-tracker:
    build:
      context: .
      dockerfile: docker/Dockerfile.wallet_tracker
    container_name: polyedge-wallet-tracker
    platform: linux/amd64
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      WALLET_TRACKER_PROFILE: ${WALLET_TRACKER_PROFILE:-ColdMath}
      WALLET_TRACKER_INTERVAL_SECONDS: ${WALLET_TRACKER_INTERVAL_SECONDS:-1800}
    volumes:
      - ./logs/wallet-tracker:/app/logs
    restart: unless-stopped
    networks:
      - polyedge
    labels:
      polyedge.role: "wallet-tracker"
      polyedge.update: "safe"

  # ── Dashboard: Next.js UI for analytics + limited DB controls ─────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: polyedge-dashboard
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - polyedge
    labels:
      polyedge.role: "dashboard"
      polyedge.update: "safe"

volumes:
  timescaledb_data:

networks:
  polyedge:
    driver: bridge
